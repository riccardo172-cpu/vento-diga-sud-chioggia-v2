<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Sottomarina</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #071522;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   CONTENITORE PRINCIPALE (Stretto per smartphone)
   ===================================================== */

.container {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 8px;
}


/* =====================================================
   TESTATA
   ===================================================== */

.header {
    text-align: center;
    margin-bottom: 8px;
}

.title {
    font-size: 21px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 2px;
}

.subtitle {
    font-size: 12px;
    color: #82d9f7;
}


/* =====================================================
   CORNICE BLU RADAR
   ===================================================== */

.radar-card {
    width: 100%;
    height: 520px;
    margin: 0 auto;
    background: #0b1d2b;
    border: 1px solid #1c607d;
    border-radius: 12px;
    padding: 4px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    overflow: hidden;
}


/* =====================================================
   IFRAME RADAR METEOBLUE
   ===================================================== */

.radar-frame {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 8px;
    background: #071522;
}


/* =====================================================
   INFORMAZIONI
   ===================================================== */

.info {
    width: 100%;
    margin: 8px 0 0 0;
    background: #0b1d2b;
    border: 1px solid #17435b;
    border-radius: 9px;
    padding: 8px;
    text-align: center;
    color: #82a7b8;
    font-size: 11px;
}


/* =====================================================
   PULSANTE AGGIORNA
   ===================================================== */

.button {
    display: block;
    width: 100%;
    margin: 8px 0 0 0;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #2182a6;
    background: #0d3a50;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
}

.button:active {
    background: #14516b;
}


/* =====================================================
   RESPONSIVE SMARTPHONE
   ===================================================== */

@media (max-width: 440px) {
    .container {
        padding: 4px;
    }

    .radar-card {
        height: 480px;
    }
}

</style>

</head>


<body>


<div class="container">

    <!-- TESTATA -->
    <div class="header">
        <div class="title">Sottomarina</div>
        <div class="subtitle">Radar meteorologico</div>
    </div>


    <!-- RADAR -->
    <div class="radar-card">
        <iframe
            id="radar"
            class="radar-frame"
            src="https://www.meteoblue.com/en/weather/maps/widget/#coords=9/45.22/12.28&map=radar~rain~none~none~none"
            title="Radar Meteo Sottomarina"
            allowfullscreen>
        </iframe>
    </div>


    <!-- INFORMAZIONI -->
    <div class="info">
        Meteoblue · Mappa radar & precipitazioni
    </div>


    <!-- AGGIORNA -->
    <button
        class="button"
        onclick="reloadRadar()">
        AGGIORNA RADAR
    </button>

</div>


<script>

function reloadRadar() {
    const radar = document.getElementById("radar");
    radar.src = "https://www.meteoblue.com/en/weather/maps/widget/#coords=9/45.22/12.28&map=radar~rain~none~none~none&t=" + Date.now();
}

</script>


</body>

</html>
