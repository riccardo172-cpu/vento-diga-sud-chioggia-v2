<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Diga Sud Chioggia</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #071522;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}

.container {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 14px;
}

.header {

    text-align: center;

    margin-bottom: 14px;
}

.title {

    font-size: 24px;

    font-weight: bold;

    color: #ffffff;

    margin-bottom: 4px;
}

.subtitle {

    font-size: 13px;

    color: #82d9f7;
}

.status {

    background: #0b1d2b;

    border: 1px solid #17435b;

    border-radius: 12px;

    padding: 10px 13px;

    margin-bottom: 12px;

    text-align: center;

    color: #82d9f7;

    font-size: 12px;
}

.radar-card {

    background:
        linear-gradient(
            180deg,
            #0d2a3d 0%,
            #091d2b 100%
        );

    border: 1px solid #1c607d;

    border-radius: 16px;

    padding: 10px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.25);

    overflow: hidden;
}

.radar-title {

    text-align: center;

    color: #82d9f7;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 9px;
}

.radar-frame {

    width: 100%;

    height: 600px;

    border: 0;

    border-radius: 10px;

    background: #ffffff;

    display: block;
}

.note {

    margin-top: 12px;

    background: #0b1d2b;

    border: 1px solid #17435b;

    border-radius: 11px;

    padding: 11px;

    color: #82a7b8;

    font-size: 11px;

    line-height: 1.45;

    text-align: center;
}

.refresh {

    width: 100%;

    background: #0d3a50;

    border: 1px solid #2182a6;

    color: #ffffff;

    border-radius: 10px;

    padding: 12px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 12px;
}

.refresh:active {

    background: #14516b;
}

@media (max-width: 600px) {

    .container {

        padding: 10px;
    }

    .title {

        font-size: 21px;
    }

    .radar-frame {

        height: 520px;
    }

}

@media (max-width: 400px) {

    .radar-frame {

        height: 470px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="title">
            Diga Sud Chioggia
        </div>

        <div class="subtitle">
            Radar meteorologico Veneto
        </div>

    </div>


    <div class="status">

        Radar ARPAV · aggiornamento ogni 10 minuti

    </div>


    <div class="radar-card">


        <div class="radar-title">

            MOSAICO RADAR METEO VENETO

        </div>


        <iframe

            id="radarFrame"

            class="radar-frame"

            src="https://meteo.arpa.veneto.it/?page=mosaicoradar"

            title="Mosaico Radar Meteo Veneto"

            loading="eager"

            allowfullscreen>

        </iframe>


    </div>


    <div class="note">

        Fonte dati: ARPAV · Radar di Teolo e
        Concordia Sagittaria.<br>

        Le immagini radar sono pubblicate in tempo reale
        e hanno carattere divulgativo.

    </div>


    <button
        class="refresh"
        onclick="refreshRadar()">

        AGGIORNA RADAR

    </button>


</div>


<script>

function refreshRadar() {

    const frame =
        document.getElementById(
            "radarFrame"
        );

    frame.src =
        "https://meteo.arpa.veneto.it/?page=mosaicoradar&t=" +
        Date.now();

}

</script>


</body>

</html>
