<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Sottomarina</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #071522;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* CONTENITORE PRINCIPALE */

.container {

    width: 100%;

    max-width: 670px;

    margin: 0 auto;

    padding: 8px;
}


/* TESTATA */

.header {

    text-align: center;

    margin-bottom: 10px;
}

.title {

    font-size: 21px;

    font-weight: bold;

    color: #ffffff;

    margin-bottom: 3px;
}

.subtitle {

    font-size: 12px;

    color: #82d9f7;
}


/* RIQUADRO RADAR */

.radar-card {

    width: 100%;

    background: #0b1d2b;

    border: 1px solid #1c607d;

    border-radius: 14px;

    padding: 4px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.25);

    overflow: hidden;
}


/* FINESTRA DEL RADAR */

.radar-wrapper {

    width: 100%;

    height: 590px;

    overflow: hidden;

    border-radius: 10px;

    position: relative;
}


/*
   PAGINA INTERNA DI METEO & RADAR

   Ridotta e centrata nella finestra.
*/

.radar-frame {

    position: absolute;

    top: 0;

    left: 50%;

    width: 700px;

    height: 700px;

    border: 0;

    border-radius: 10px;

    background: #071522;

    transform:
        translateX(-50%)
        scale(0.84);

    transform-origin:
        top center;
}


/* INFORMAZIONI */

.info {

    margin-top: 9px;

    background: #0b1d2b;

    border: 1px solid #17435b;

    border-radius: 10px;

    padding: 9px;

    text-align: center;

    color: #82a7b8;

    font-size: 10px;
}


/* PULSANTE */

.button {

    width: 100%;

    margin-top: 10px;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid #2182a6;

    background: #0d3a50;

    color: #ffffff;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}

.button:active {

    background: #14516b;
}


/* SMARTPHONE */

@media (max-width: 670px) {

    .container {

        max-width: 100%;

        padding: 6px;
    }

    .title {

        font-size: 20px;
    }

    .subtitle {

        font-size: 11px;
    }

    .radar-card {

        padding: 4px;
    }

    .radar-wrapper {

        height: 590px;
    }

}


/* SMARTPHONE PICCOLO */

@media (max-width: 380px) {

    .container {

        padding: 5px;
    }

    .title {

        font-size: 19px;
    }

    .radar-wrapper {

        height: 570px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- TESTATA -->

    <div class="header">

        <div class="title">
            Sottomarina
        </div>

        <div class="subtitle">
            Radar meteorologico
        </div>

    </div>


    <!-- RADAR -->

    <div class="radar-card">


        <div class="radar-wrapper">


            <iframe

                id="radar"

                class="radar-frame"

                src="https://www.meteoeradar.it/radar-meteo?center=45.54%2C12.16&zoom=7.53&loop=true"

                title="Radar Meteo & Radar"

                allowfullscreen>

            </iframe>


        </div>


    </div>


    <!-- INFORMAZIONI -->

    <div class="info">

        Radar Meteo & Radar ·
        animazione radar

    </div>


    <!-- AGGIORNA -->

    <button
        class="button"
        onclick="reloadRadar()">

        AGGIORNA RADAR

    </button>


</div>


<script>

function reloadRadar() {

    const radar =
        document.getElementById("radar");

    radar.src =
        "https://www.meteoeradar.it/radar-meteo?center=45.54%2C12.16&zoom=7.53&loop=true&t=" +
        Date.now();

}

</script>


</body>

</html>
