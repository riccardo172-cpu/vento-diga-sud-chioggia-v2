<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0b0f19;
    color: #ffffff;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  
  .app-card {
    width: 100%;
    max-width: 480px;
    background: #161e2e;
    border-radius: 16px;
    padding: 18px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .spot-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
  }

  .tag-model {
    background: rgba(0, 229, 255, 0.15);
    color: #00e5ff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .forecast-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    text-align: center;
  }

  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.03);
    padding: 10px 2px;
    border-radius: 10px;
  }

  .time { font-size: 11px; color: #94a3b8; font-weight: 600; }

  /* Mappatura Colori Custom basata sui nodi reali */
  .wind-badge {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
  }

  .v-light  { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }  /* < 9 kt */
  .v-breeze { background: #059669; color: #ffffff; }                             /* 9-12 kt */
  .v-ideal  { background: #d97706; color: #ffffff; }                             /* 13-16 kt */

  .gusts { font-size: 10px; color: #64748b; }
  .gusts span { color: #cbd5e1; font-weight: 600; }

  .dir-icon { font-size: 16px; color: #38bdf8; }

  .footer {
    margin-top: 14px;
    font-size: 11px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="app-card">
  <div class="card-header">
    <span class="spot-title">Sottomarina</span>
    <span class="tag-model">WG (GFS 13km)</span>
  </div>

  <div class="forecast-grid">
    <!-- 08h -->
    <div class="col">
      <div class="time">08h</div>
      <div class="wind-badge v-light">7</div>
      <div class="gusts">R <span>9</span></div>
      <div class="dir-icon">↗</div>
    </div>
    <!-- 10h -->
    <div class="col">
      <div class="time">10h</div>
      <div class="wind-badge v-breeze">9</div>
      <div class="gusts">R <span>11</span></div>
      <div class="dir-icon">↗</div>
    </div>
    <!-- 12h -->
    <div class="col">
      <div class="time">12h</div>
      <div class="wind-badge v-breeze">9</div>
      <div class="gusts">R <span>13</span></div>
      <div class="dir-icon">➔</div>
    </div>
    <!-- 14h -->
    <div class="col">
      <div class="time">14h</div>
      <div class="wind-badge v-breeze">9</div>
      <div class="gusts">R <span>13</span></div>
      <div class="dir-icon">↘</div>
    </div>
    <!-- 16h -->
    <div class="col">
      <div class="time">16h</div>
      <div class="wind-badge v-light">8</div>
      <div class="gusts">R <span>11</span></div>
      <div class="dir-icon">↘</div>
    </div>
    <!-- 18h -->
    <div class="col">
      <div class="time">18h</div>
      <div class="wind-badge v-light">8</div>
      <div class="gusts">R <span>11</span></div>
      <div class="dir-icon">↘</div>
    </div>
  </div>

  <div class="footer">
    <span>Dati estratti dallo spot #49147</span>
    <span>Unità: Nodi (kt)</span>
  </div>
</div>

</body>
</html>
