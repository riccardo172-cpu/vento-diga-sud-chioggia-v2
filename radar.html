<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Sottomarina</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #071522;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   CONTENITORE PRINCIPALE (Più stretto per Smartphone)
   ===================================================== */

.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 6px;
}


/* =====================================================
   TESTATA
   ===================================================== */

.header {
    text-align: center;
    margin-bottom: 6px;
}

.title {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 2px;
}

.subtitle {
    font-size: 12px;
    color: #82d9f7;
}


/* =====================================================
   CORNICE BLU ESTERNA
   Altezza aumentata a 620px per contenere le scritte in basso
   ===================================================== */

.radar-card {
    width: 100%;
    height: 620px;
    margin: 0 auto;
    background: #0b1d2b;
    border: 1px solid #1c607d;
    border-radius: 12px;
    padding: 3px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.25);
}


/* =====================================================
   FINESTRA DI RITAGLIO
   ===================================================== */

.radar-wrapper {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 8px;
    position: relative;
}


/* =====================================================
   IFRAME RADAR
   Centrato su Sottomarina/Chioggia e ritagliato per mostrare
   interamente i pulsanti in basso
   ===================================================== */

.radar-frame {
    position: absolute;
    top: -95px;
    left: 50%;
    width: 820px;
    height: 750px;
    border: 0;
    background: #071522;
    transform: translateX(-50%);
}


/* =====================================================
   INFORMAZIONI
   ===================================================== */

.info {
    width: 100%;
    margin: 6px 0 0 0;
    background: #0b1d2b;
    border: 1px solid #17435b;
    border-radius: 9px;
    padding: 8px;
    text-align: center;
    color: #82a7b8;
    font-size: 10px;
}


/* =====================================================
   PULSANTE AGGIORNA
   ===================================================== */

.button {
    display: block;
    width: 100%;
    margin: 6px 0 0 0;
    padding: 11px;
    border-radius: 9px;
    border: 1px solid #2182a6;
    background: #0d3a50;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
}

.button:active {
    background: #14516b;
}


/* =====================================================
   RESPONSIVE SMARTPHONE
   ===================================================== */

@media (max-width: 480px) {
    .radar-card {
        height: 580px;
    }

    .radar-frame {
        top: -90px;
        transform: translateX(-50%) scale(0.92);
        transform-origin: top center;
    }
}

@media (max-width: 380px) {
    .radar-card {
        height: 540px;
    }

    .radar-frame {
        top: -85px;
        transform: translateX(-50%) scale(0.85);
        transform-origin: top center;
    }
}

</style>

</head>


<body>


<div class="container">

    <!-- TESTATA -->
    <div class="header">
        <div class="title">
            Sottomarina
        </div>
        <div class="subtitle">
            Radar meteorologico
        </div>
    </div>


    <!-- RADAR -->
    <div class="radar-card">
        <div class="radar-wrapper">
            <iframe
                id="radar"
                class="radar-frame"
                src="https://www.meteoeradar.it/radar-meteo?center=45.22%2C12.28&zoom=8.5&loop=true"
                title="Radar Meteo & Radar"
                allowfullscreen>
            </iframe>
        </div>
    </div>


    <!-- INFORMAZIONI -->
    <div class="info">
        Radar Meteo & Radar · animazione radar
    </div>


    <!-- AGGIORNA -->
    <button
        class="button"
        onclick="reloadRadar()">
        AGGIORNA RADAR
    </button>

</div>


<script>

function reloadRadar() {
    const radar = document.getElementById("radar");
    radar.src = "https://www.meteoeradar.it/radar-meteo?center=45.22%2C12.28&zoom=8.5&loop=true&t=" + Date.now();
}

</script>


</body>

</html>
