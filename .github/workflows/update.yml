name: Aggiorna Vento Diga Sud

on:
  schedule:
    - cron: '*/10 * * * *'  # Esegue il controllo ogni 10 minuti
  workflow_dispatch:        # Ti permette di avviarlo anche a mano quando vuoi

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py
