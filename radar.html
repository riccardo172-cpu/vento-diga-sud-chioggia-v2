<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Diga Sud Chioggia</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #071522;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* CONTENITORE MOBILE */

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 8px;
}

/* TESTATA */

.header {
    text-align: center;
    margin-bottom: 10px;
}

.title {
    font-size: 21px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 3px;
}

.subtitle {
    font-size: 12px;
    color: #82d9f7;
}

/* RADAR */

.radar-card {
    width: 100%;
    background: #0b1d2b;
    border: 1px solid #1c607d;
    border-radius: 14px;
    padding: 5px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
}

/*
   Il radar viene mantenuto leggermente più largo
   della schermata per evitare che gli elementi
   laterali vengano tagliati.
*/

.radar-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 10px;
    -webkit-overflow-scrolling: touch;
}

/*
   Larghezza minima interna del radar.
   Su smartphone permette alla pagina radar
   di mantenere tutti i suoi strumenti.
*/

.radar-inner {
    width: 620px;
    min-width: 620px;
}

.radar-frame {
    display: block;
    width: 620px;
    min-width: 620px;
    height: 620px;
    border: 0;
    border-radius: 10px;
    background: #071522;
}

/* INDICAZIONE */

.swipe-info {
    text-align: center;
    color: #82a7b8;
    font-size: 10px;
    margin-top: 7px;
}

/* PULSANTE */

.button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #2182a6;
    background: #0d3a50;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.button:active {
    background: #14516b;
}

/* INFORMAZIONI */

.info {
    margin-top: 9px;
    background: #0b1d2b;
    border: 1px solid #17435b;
    border-radius: 10px;
    padding: 9px;
    text-align: center;
    color: #82a7b8;
    font-size: 10px;
}

/* SMARTPHONE PICCOLO */

@media (max-width: 380px) {

    .container {
        padding: 6px;
    }

    .title {
        font-size: 20px;
    }

    .radar-card {
        padding: 4px;
    }

    .radar-inner {
        width: 620px;
        min-width: 620px;
    }

    .radar-frame {
        width: 620px;
        min-width: 620px;
        height: 590px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="title">
            Diga Sud Chioggia
        </div>

        <div class="subtitle">
            Radar meteorologico
        </div>

    </div>


    <div class="radar-card">


        <div class="radar-wrapper">


            <div class="radar-inner">


                <iframe

                    id="radar"

                    class="radar-frame"

                    src="https://www.meteoeradar.it/radar-meteo?center=45.66%2C13.36&zoom=5.69&loop=true"

                    title="Radar Meteo & Radar"

                    allowfullscreen>

                </iframe>


            </div>


        </div>


        <div class="swipe-info">

            Scorri lateralmente se necessario

        </div>


    </div>


    <div class="info">

        Radar Meteo & Radar ·
        visualizzazione interattiva

    </div>


    <button
        class="button"
        onclick="reloadRadar()">

        AGGIORNA RADAR

    </button>


</div>


<script>

function reloadRadar() {

    const radar =
        document.getElementById("radar");

    radar.src =
        "https://www.meteoeradar.it/radar-meteo?center=45.66%2C13.36&zoom=5.69&loop=true&t=" +
        Date.now();

}

</script>


</body>

</html>
