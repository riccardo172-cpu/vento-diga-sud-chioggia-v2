<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Diga Sud Chioggia</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #071522;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 12px;
}

.header {
    text-align: center;
    margin-bottom: 12px;
}

.title {
    font-size: 23px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 3px;
}

.subtitle {
    font-size: 13px;
    color: #82d9f7;
}

.radar-card {
    background: #0b1d2b;
    border: 1px solid #1c607d;
    border-radius: 15px;
    padding: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    overflow: hidden;
}

.radar-frame {
    display: block;
    width: 100%;
    height: 720px;
    border: 0;
    border-radius: 10px;
    background: #071522;
}

.info {
    margin-top: 10px;
    background: #0b1d2b;
    border: 1px solid #17435b;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    color: #82a7b8;
    font-size: 11px;
}

.button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #2182a6;
    background: #0d3a50;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.button:active {
    background: #14516b;
}

@media (max-width: 600px) {

    .container {
        padding: 8px;
    }

    .title {
        font-size: 21px;
    }

    .radar-frame {
        height: 650px;
    }

}

@media (max-width: 400px) {

    .radar-frame {
        height: 590px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="title">
            Diga Sud Chioggia
        </div>

        <div class="subtitle">
            Radar meteorologico
        </div>

    </div>


    <div class="radar-card">

        <iframe
            id="radar"
            class="radar-frame"
            src="https://www.meteoeradar.it/radar-meteo?center=45.66%2C13.36&zoom=5.69&loop=true"
            title="Radar Meteo & Radar"
            allowfullscreen>
        </iframe>

    </div>


    <div class="info">

        Radar Meteo & Radar ·
        visualizzazione interattiva

    </div>


    <button
        class="button"
        onclick="reloadRadar()">

        AGGIORNA RADAR

    </button>


</div>


<script>

function reloadRadar() {

    const radar =
        document.getElementById("radar");

    radar.src =
        "https://www.meteoeradar.it/radar-meteo?center=45.66%2C13.36&zoom=5.69&loop=true&t=" +
        Date.now();

}

</script>


</body>

</html>
