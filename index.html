.compass {

  margin: auto;

}

.compass::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 1px solid rgba(137, 190, 215, 0.2);
}

.compass::after {
  content: "";

  inset: 23%;
  border-radius: 50%;
  border: 1px solid rgba(137, 190, 215, 0.12);
}

.cardinal {

  font-size: 12px;
  font-weight: bold;
  color: #b9d5e3;
  z-index: 3;
}

.north {
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
}

.south {
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
}

.east {
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
}

.west {
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
}

.tick {
  position: absolute;

  background: rgba(180, 215, 230, 0.45);

}

.t1  { transform: translate(-50%, -95px) rotate(0deg); }

  height: 0;

  border-right: 10px solid transparent;

  transform: translate(-50%, -57px) rotate(0deg);
  filter: drop-shadow(0 0 6px rgba(85,214,255,0.5));
  z-index: 5;
}

.arrow::after {
  content: "";

  left: -10px;

  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 18px solid rgba(255,255,255,0.2);
}
