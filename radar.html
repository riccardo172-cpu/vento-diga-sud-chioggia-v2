<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Radar Meteo · Sottomarina</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #071522;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   CONTENITORE PRINCIPALE (Alinea tutto per smartphone)
   ===================================================== */

.container {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 8px;
}


/* =====================================================
   TESTATA
   ===================================================== */

.header {
    text-align: center;
    margin-bottom: 8px;
}

.title {
    font-size: 21px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 2px;
}

.subtitle {
    font-size: 12px;
    color: #82d9f7;
}


/* =====================================================
   SELETTORE PULSANTI (Radar, Satellite, Torna al Sito)
   ===================================================== */

.selector-grid {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

.btn-select {
    flex: 1;
    padding: 9px 4px;
    background: #0b1d2b;
    border: 1px solid #1c607d;
    border-radius: 8px;
    color: #82a7b8;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-select.active {
    background: #2182a6;
    color: #ffffff;
    border-color: #55caef;
}

.btn-home {
    background: #14496b;
    border-color: #2b84b8;
    color: #e0f2fe;
}


/* =====================================================
   CORNICE BLU RADAR
   ===================================================== */

.radar-card {
    width: 100%;
    height: 480px;
    margin: 0 auto;
    background: #0b1d2b;
    border: 1px solid #1c607d;
    border-radius: 12px;
    padding: 4px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    overflow: hidden;
}


/* =====================================================
   IFRAME RADAR WINDY
   ===================================================== */

.radar-frame {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 8px;
    background: #071522;
}


/* =====================================================
   INFORMAZIONI E PULSANTE AGGIORNA
   ===================================================== */

.info {
    width: 100%;
    margin: 8px 0 0 0;
    background: #0b1d2b;
    border: 1px solid #17435b;
    border-radius: 9px;
    padding: 8px;
    text-align: center;
    color: #82a7b8;
    font-size: 11px;
}

.button {
    display: block;
    width: 100%;
    margin: 8px 0 0 0;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #2182a6;
    background: #0d3a50;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
}

.button:active {
    background: #14516b;
}


/* =====================================================
   RESPONSIVE SMARTPHONE
   ===================================================== */

@media (max-width: 440px) {
    .container {
        padding: 4px;
    }

    .radar-card {
        height: 440px;
    }
}

</style>

</head>


<body>


<div class="container">

    <!-- TESTATA -->
    <div class="header">
        <div class="title">Sottomarina</div>
        <div class="subtitle">Radar e Satellite Meteo</div>
    </div>


    <!-- 3 PULSANTI: RADAR, SATELLITE, RITORNO -->
    <div class="selector-grid">
        <button id="btn-radar" class="btn-select active" onclick="setLayer('radar')">Radar Pioggia</button>
        <button id="btn-sat" class="btn-select" onclick="setLayer('sat')">Satellite Nuvole</button>
        <a href="https://riccardo172-cpu.github.io/vento-diga-sud-chioggia-v2/" class="btn-select btn-home">Torna al Sito</a>
    </div>


    <!-- RADAR / SATELLITE MAP -->
    <div class="radar-card">
        <iframe
            id="radar"
            class="radar-frame"
            src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=9&overlay=radar&product=radar&level=surface&lat=45.218&lon=12.278"
            title="Radar Meteo Sottomarina"
            allowfullscreen>
        </iframe>
    </div>


    <!-- INFORMAZIONI -->
    <div id="info-text" class="info">
        Windy · Radar Precipitazioni in tempo reale
    </div>


    <!-- AGGIORNA MAPPA -->
    <button
        class="button"
        onclick="reloadRadar()">
        AGGIORNA MAPPA
    </button>

</div>


<script>

let currentLayer = 'radar';

const urls = {
    radar: "https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=9&overlay=radar&product=radar&level=surface&lat=45.218&lon=12.278",
    sat: "https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=9&overlay=satellite&product=satellite&level=surface&lat=45.218&lon=12.278"
};

const infos = {
    radar: "Windy · Radar Precipitazioni in tempo reale",
    sat: "Windy · Satellite Copertura Nuvolosa"
};

function setLayer(layer) {
    currentLayer = layer;

    // Gestione attivo/inattivo sui pulsanti
    document.getElementById('btn-radar').classList.remove('active');
    document.getElementById('btn-sat').classList.remove('active');
    document.getElementById('btn-' + layer).classList.add('active');

    // Aggiornamento testo informativo
    document.getElementById('info-text').innerText = infos[layer];

    // Cambia layer nella mappa
    document.getElementById('radar').src = urls[layer];
}

function reloadRadar() {
    const radar = document.getElementById("radar");
    radar.src = urls[currentLayer] + "&t=" + Date.now();
}

</script>


</body>

</html>
